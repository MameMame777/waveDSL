[package]
name = "wavedsl"
version = "0.3.0"
edition = "2021"
description = "WaveDSL compiler — converts WaveDSL source into WaveDrom JSON"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
