<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WaveDSL Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wavedrom/3.5.0/wavedrom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wavedrom/3.5.0/skins/default.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        textarea { width: 100%; height: 200px; font-family: monospace; font-size: 14px; }
        #error { color: red; margin: 10px 0; }
        #wave { margin-top: 20px; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>WaveDSL Viewer</h1>
    <textarea id="input" placeholder="Paste WaveDrom JSON here..."></textarea>
    <br><br>
    <button onclick="render()">Render</button>
    <div id="error"></div>
    <div id="wave"></div>
    <script>
        function render() {
            var errorDiv = document.getElementById('error');
            var waveDiv = document.getElementById('wave');
            errorDiv.textContent = '';
            waveDiv.innerHTML = '';

            var text = document.getElementById('input').value.trim();
            if (!text) return;

            try {
                var obj = JSON.parse(text);
                waveDiv.innerHTML = '<div id="WaveDrom_Display_0"></div>';
                WaveDrom.RenderWaveForm(0, obj, 'WaveDrom_Display_0');
            } catch (e) {
                errorDiv.textContent = 'Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
